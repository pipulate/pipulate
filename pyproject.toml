[build-system]
requires = ["setuptools>=61.0", "build", "twine"]
build-backend = "setuptools.build_meta"

[project]
name = "pipulate"
# VERSION NOTE: Synced from pipulate/__init__.py.__version__ via python version_sync.py
version = "1.87"
authors = [
  { name="Mike Levin", email="pipulate@gmail.com" },
]
description = "A Notebook-inspired Hand-cranked Agentic Framework"
readme = "README.md"
license = "MIT"
requires-python = ">=3.8"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
keywords = ["seo", "ai", "llm", "automation", "local-first", "nix", "fasthtml", "htmx", "agentic"]
dependencies = [
    "blinker==1.6.2",
    "apsw==3.50.3.0",
    "piper-tts",
    "onnxruntime",
    "google-generativeai",
    "langchain",
    "langchain-openai",
    "langchain-google-genai",
    "langchain-community",
    "jupyterlab",
    "jupyter-ai[all]",
    "ipywidgets",
    "itables",
    "jupytext",
    "nbstripout",
    "requests",
    "beautifulsoup4",
    "pandas",
    "openpyxl",
    "lxml",
    "python-fasthtml",
    "uvicorn",
    "selenium",
    "undetected-chromedriver",
    "webdriver-manager",
    "matplotlib",
    "scikit-learn",
    "numpy",
    "pylint",
    "vulture",
    "yapf",
    "isort",
    "python-dotenv",
    "loguru",
    "rich",
    "watchdog",
]

[project.urls]
"Homepage" = "https://github.com/miklevin/pipulate/"
"Bug Tracker" = "https://github.com/miklevin/pipulate/issues"
"Documentation" = "https://pipulate.com/guide/"

# This creates the `pipulate` command
[project.scripts]
pipulate = "cli:main"

[tool.setuptools]
py-modules = ["cli", "server", "common", "config", "ai_dictdb", "__init__"]

[tool.setuptools.packages.find]
where = ["."]
include = ["apps*", "imports*", "tools*", "static*", "pipulate*"]
exclude = [
    "logs*", 
    "data*", 
    "downloads*", 
    "scripts*", 
    "browser_cache*",
    "Notebooks*",
    ".venv*"
]

[tool.setuptools.package-data]
"*" = [
    "assets/installer/install.sh", 
    "flake.nix",
    "README.md",
    "LICENSE",
    "CHANGELOG.md"
]

[tool.ruff]
line-length = 120
target-version = "1.87"

[tool.ruff.lint]
# Start with a minimal, non-noisy ruleset.
# E = pycodestyle errors, F = pyflakes, W = pycodestyle warnings
select = ["E", "F", "W"]

ignore = [
    # FastHTML route handlers registered via @rt() decorator appear unused to static analysis.
    # These are the core false positives in this codebase.
    "F401",   # imported but unused — FastHTML imports Card, Div, Form etc. into namespace
    "F811",   # redefinition of unused name — common in HTMX step pattern where step_N redefines patterns
    "E501",   # line too long — inline HTMX chains are intentionally dense
    "E701",   # multiple statements on one line — preserves dense if/return logic
    "W291",   # trailing whitespace — harmless text artifacts
    "W293",   # blank line contains whitespace — harmless
    "F541",   # f-string without placeholders — allows uniform print(f"...") styling
    "F403",   # star imports — FastHTML relies on `from fasthtml.common import *`
    "F405",   # undefined name from star imports — FastHTML components (Card, Div, etc.)
    "E402",   # module level import not at top — lazy loading and circular dep prevention
    "F841",   # unused local variables — common during rapid iteration
    "E722",   # bare except — used intentionally in fallback routines
    "W605",   # invalid escape sequence — prompt templates contain regex-like escapes
]

# Never flag these directories
exclude = [
    ".venv",
    "Notebooks",
    "scripts",
    "browser_cache",
    "data",
    "downloads",
    "logs",
]
